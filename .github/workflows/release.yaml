name: Build and Release PDF
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v5
      - run: typst compile main.typ Thesis.pdf
      - uses: softprops/action-gh-release@v2
        with:
          files: Thesis.pdf
